services:
  mariadb:
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${MARIADB_MEMORY_LIMIT:-512m}
    cpus: ${MARIADB_CPUS:-0.75}

  wordpress:
    environment:
      WORDPRESS_ENVIRONMENT_TYPE: staging
      WP_DEBUG: "false"
      WORDPRESS_DEBUG: "false"
      WP_DEBUG_LOG: "true"
      WP_DEBUG_DISPLAY: "false"
      DISALLOW_FILE_EDIT: "false"
      DISALLOW_FILE_MODS: "false"
    volumes:
      - wordpress_plugins:/var/www/html/wp-content/plugins
    tmpfs:
      - /tmp
      - /run
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${WORDPRESS_MEMORY_LIMIT:-640m}
    cpus: ${WORDPRESS_CPUS:-0.75}

  nginx:
    environment:
      NGINX_SERVER_NAME: ${TEST_DOMAIN:?Set TEST_DOMAIN}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./docker/nginx/server.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - wordpress_plugins:/var/www/html/wp-content/plugins:ro
    secrets:
      - basic_auth
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${NGINX_MEMORY_LIMIT:-128m}
    cpus: ${NGINX_CPUS:-0.25}

  wpcli:
    environment:
      WORDPRESS_ENVIRONMENT_TYPE: staging
      WP_DEBUG: "false"
      WORDPRESS_DEBUG: "false"
      WP_DEBUG_LOG: "true"
      WP_DEBUG_DISPLAY: "false"
      DISALLOW_FILE_EDIT: "false"
      DISALLOW_FILE_MODS: "false"
    volumes:
      - wordpress_plugins:/var/www/html/wp-content/plugins
    security_opt:
      - no-new-privileges:true

  certbot:
    image: certbot/certbot:v5.7.0@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    profiles: [tls]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - application
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  letsencrypt:
  certbot_www:
  wordpress_plugins:

secrets:
  basic_auth:
    file: ${SECRETS_DIR:?Set SECRETS_DIR}/basic_auth
